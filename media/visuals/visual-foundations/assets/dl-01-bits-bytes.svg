<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-labelledby="title desc">
  <title id="title">Bits combine into bytes</title>
  <desc id="desc">Eight binary bits grouped together make one byte; the example shows eight positions and a bracket labelled one byte.</desc>
  <rect width="640" height="260" rx="20" fill="#f5f3ff"/>
  <text x="320" y="48" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#241b55">Eight bits make one byte</text>
  <g font-family="sans-serif" font-size="22" text-anchor="middle" fill="#241b55">
    <rect x="56" y="92" width="54" height="54" rx="8" fill="#d8d0ff" stroke="#4b36c7" stroke-width="2"/><text x="83" y="128">1</text>
    <rect x="128" y="92" width="54" height="54" rx="8" fill="#d8d0ff" stroke="#4b36c7" stroke-width="2"/><text x="155" y="128">0</text>
    <rect x="200" y="92" width="54" height="54" rx="8" fill="#d8d0ff" stroke="#4b36c7" stroke-width="2"/><text x="227" y="128">1</text>
    <rect x="272" y="92" width="54" height="54" rx="8" fill="#d8d0ff" stroke="#4b36c7" stroke-width="2"/><text x="299" y="128">0</text>
    <rect x="344" y="92" width="54" height="54" rx="8" fill="#d8d0ff" stroke="#4b36c7" stroke-width="2"/><text x="371" y="128">0</text>
    <rect x="416" y="92" width="54" height="54" rx="8" fill="#d8d0ff" stroke="#4b36c7" stroke-width="2"/><text x="443" y="128">1</text>
    <rect x="488" y="92" width="54" height="54" rx="8" fill="#d8d0ff" stroke="#4b36c7" stroke-width="2"/><text x="515" y="128">1</text>
    <rect x="560" y="92" width="24" height="54" rx="8" fill="#d8d0ff" stroke="#4b36c7" stroke-width="2"/><text x="572" y="128">0</text>
    <path d="M48 176v26h544v-26" fill="none" stroke="#4b36c7" stroke-width="3"/>
    <text x="320" y="232" font-size="20">one byte</text>
  </g>
</svg>
