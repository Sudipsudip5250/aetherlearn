<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="title desc">
  <title id="title">File, folder, storage, and backup relationship</title>
  <desc id="desc">A file sits inside a folder, the folder is kept on storage, and a separate copy is labelled backup.</desc>
  <rect width="720" height="300" rx="20" fill="#eefbf7"/>
  <text x="360" y="45" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#173f38">Organize, store, and copy</text>
  <g font-family="sans-serif" text-anchor="middle" fill="#173f38">
    <rect x="42" y="112" width="132" height="76" rx="12" fill="#c7f1e7" stroke="#268c77" stroke-width="2"/><text x="108" y="157" font-size="22" font-weight="700">File</text>
    <path d="M174 150h44" stroke="#268c77" stroke-width="4"/><path d="m207 139 13 11-13 11" fill="none" stroke="#268c77" stroke-width="4"/>
    <rect x="220" y="95" width="160" height="110" rx="12" fill="#b3e4d7" stroke="#268c77" stroke-width="2"/><text x="300" y="145" font-size="22" font-weight="700">Folder</text><text x="300" y="174" font-size="15">groups files</text>
    <path d="M380 150h44" stroke="#268c77" stroke-width="4"/><path d="m413 139 13 11-13 11" fill="none" stroke="#268c77" stroke-width="4"/>
    <rect x="426" y="112" width="132" height="76" rx="12" fill="#8fd3c2" stroke="#268c77" stroke-width="2"/><text x="492" y="157" font-size="22" font-weight="700">Storage</text>
    <path d="M492 188v39h146" stroke="#268c77" stroke-width="3" fill="none"/><path d="m627 216 11 11-11 11" fill="none" stroke="#268c77" stroke-width="3"/>
    <rect x="548" y="234" width="130" height="45" rx="10" fill="#fff" stroke="#268c77" stroke-width="2"/><text x="613" y="263" font-size="18" font-weight="700">Backup copy</text>
  </g>
</svg>
