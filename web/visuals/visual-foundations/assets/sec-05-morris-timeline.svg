<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">A historical case study can be organized around impact and response.</title><desc id="desc">The non-operational timeline moves from the 1988 event to affected systems, institutional response, and defensive lessons without reproducing procedures.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b34b2b"/></marker></defs><rect width="640" height="360" fill="#ffffff"/><text x="320" y="38" text-anchor="middle" font-size="22" font-family="sans-serif" font-weight="700" fill="#17152a">A historical case study can be organized around impact and response.</text><path d="M90 180 H570" stroke="#40318f" stroke-width="5"/><circle cx="90" cy="180" r="24" fill="#f4f1ff" stroke="#40318f" stroke-width="3"/><text x="90" y="135" text-anchor="middle" font-size="16" font-family="sans-serif">1988</text><circle cx="250" cy="180" r="24" fill="#f4f1ff" stroke="#40318f" stroke-width="3"/><text x="250" y="135" text-anchor="middle" font-size="16" font-family="sans-serif">Impact</text><circle cx="410" cy="180" r="24" fill="#f4f1ff" stroke="#40318f" stroke-width="3"/><text x="410" y="135" text-anchor="middle" font-size="16" font-family="sans-serif">Response</text><circle cx="570" cy="180" r="24" fill="#f4f1ff" stroke="#40318f" stroke-width="3"/><text x="570" y="135" text-anchor="middle" font-size="16" font-family="sans-serif">Lessons</text><text x="320" y="348" text-anchor="middle" font-size="14" font-family="sans-serif" fill="#17152a">Static study diagram · labels are part of the explanation</text></svg>