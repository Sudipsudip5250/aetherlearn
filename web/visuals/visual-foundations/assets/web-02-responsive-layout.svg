<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Responsive design preserves reading order as space changes.</title><desc id="desc">The layout comparison shows a wide arrangement becoming a stacked narrow arrangement while keeping content order and controls reachable.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b34b2b"/></marker></defs><rect width="640" height="360" fill="#ffffff"/><text x="320" y="38" text-anchor="middle" font-size="22" font-family="sans-serif" font-weight="700" fill="#17152a">Responsive design preserves reading order as space changes.</text><path d="M 142 174 H 164" stroke="#b34b2b" stroke-width="4" marker-end="url(#arrow)"/><path d="M 292 174 H 314" stroke="#b34b2b" stroke-width="4" marker-end="url(#arrow)"/><path d="M 442 174 H 464" stroke="#b34b2b" stroke-width="4" marker-end="url(#arrow)"/><rect x="24" y="136" width="118" height="76" rx="12" fill="#f4f1ff" stroke="#40318f" stroke-width="3"/><text x="83" y="180" text-anchor="middle" font-size="18" font-family="sans-serif" fill="#17152a">Wide viewport</text><rect x="174" y="136" width="118" height="76" rx="12" fill="#f4f1ff" stroke="#40318f" stroke-width="3"/><text x="233" y="180" text-anchor="middle" font-size="18" font-family="sans-serif" fill="#17152a">Readable flow</text><rect x="324" y="136" width="118" height="76" rx="12" fill="#f4f1ff" stroke="#40318f" stroke-width="3"/><text x="383" y="180" text-anchor="middle" font-size="18" font-family="sans-serif" fill="#17152a">Narrow viewport</text><rect x="474" y="136" width="118" height="76" rx="12" fill="#f4f1ff" stroke="#40318f" stroke-width="3"/><text x="533" y="180" text-anchor="middle" font-size="18" font-family="sans-serif" fill="#17152a">Stack</text><text x="320" y="348" text-anchor="middle" font-size="14" font-family="sans-serif" fill="#17152a">Static study diagram · labels are part of the explanation</text></svg>