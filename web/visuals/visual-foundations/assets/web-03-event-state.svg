<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">A local interface can be traced from event to state and UI update.</title><desc id="desc">The cycle makes the event, validation, state transition, and visible update explicit while keeping data local.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b34b2b"/></marker></defs><rect width="640" height="360" fill="#ffffff"/><text x="320" y="38" text-anchor="middle" font-size="22" font-family="sans-serif" font-weight="700" fill="#17152a">A local interface can be traced from event to state and UI update.</text><path d="M320 68 C470 68 520 120 520 174 C520 246 438 292 320 292 C190 292 120 250 120 174 C120 114 194 68 320 68" fill="none" stroke="#40318f" stroke-width="5" marker-end="url(#arrow)"/><circle cx="320" cy="68" r="38" fill="#f4f1ff" stroke="#40318f" stroke-width="3"/><circle cx="520" cy="174" r="38" fill="#fff4d6" stroke="#b34b2b" stroke-width="3"/><circle cx="320" cy="292" r="38" fill="#e7f4ee" stroke="#2b6f55" stroke-width="3"/><circle cx="120" cy="174" r="38" fill="#f4f1ff" stroke="#40318f" stroke-width="3"/><text x="320" y="74" text-anchor="middle" font-size="15" font-family="sans-serif">Event</text><text x="520" y="180" text-anchor="middle" font-size="15" font-family="sans-serif">Validate</text><text x="320" y="298" text-anchor="middle" font-size="15" font-family="sans-serif">State</text><text x="120" y="180" text-anchor="middle" font-size="15" font-family="sans-serif">UI</text><text x="320" y="348" text-anchor="middle" font-size="14" font-family="sans-serif" fill="#17152a">Static study diagram · labels are part of the explanation</text></svg>