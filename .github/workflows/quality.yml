name: Quality

# Validate (Python/content, ~1 min) runs on every push/PR.
# Android APK assembly (~7 min) is NOT on every push: GitHub Free is
# 2,000 minutes/month. Build APKs with the "Publish debug APK" workflow
# (workflow_dispatch or a debug-* tag) or run this workflow manually.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      build_android:
        description: "Also assemble debug/release APKs (uses ~7 minutes)"
        type: boolean
        default: false

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Check local Markdown links
        run: python scripts/check_markdown_links.py

      - name: Check web payload mirrors canonical lessons
        run: python scripts/check_web_content.py

      - name: Check Android bundled content mirrors canonical lessons
        run: python scripts/check_android_content.py

      - name: Check optional visual-pack mirrors
        run: python scripts/check_visual_pack_mirrors.py

      - name: Validate optional visual pack and deterministic archive
        run: |
          python scripts/validate_visual_pack.py media/visuals/visual-foundations
          python scripts/validate_visual_pack.py docs/sample-pack/aetherlearn-visual-foundations-1.1.0.zip
          (cd docs/sample-pack && sha256sum -c aetherlearn-visual-foundations-1.1.0.zip.SHA256SUMS)
          python scripts/build_visual_pack.py --source-dir media/visuals/visual-foundations --output build/visual-pack.zip
          cmp build/visual-pack.zip docs/sample-pack/aetherlearn-visual-foundations-1.1.0.zip

      - name: Check Android manifest security boundary
        run: python scripts/check_android_manifest.py

      - name: Check dependency pinning
        run: python scripts/check_dependency_pins.py

      - name: Check common secret patterns
        run: python scripts/check_secrets.py

      - name: Validate content and build deterministic pack
        run: python scripts/build_pack.py --content-dir content/core --output-dir build/core-pack

      - name: Run validator against generated manifest
        run: python scripts/validate_content.py --content-dir content/core --manifest build/core-pack/manifest.json

      - name: Check web syntax and JSON
        run: |
          node --check web/app.js
          node --check web/idb.js
          node --check web/sw.js
          python -m json.tool web/content/manifest.json >/dev/null
          python -m json.tool web/manifest.webmanifest >/dev/null

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Check whitespace
        run: git diff --check

  android:
    if: github.event_name == 'workflow_dispatch' && inputs.build_android
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build, test, and lint Android app
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease testDebugUnitTest lintDebug

      - name: Verify APK checksums
        run: |
          mkdir -p build/release
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk > build/release/app-debug.SHA256SUMS
          sha256sum android/app/build/outputs/apk/release/app-release-unsigned.apk > build/release/app-release-unsigned.SHA256SUMS
          python scripts/check_release_artifact.py android/app/build/outputs/apk/debug/app-debug.apk build/release/app-debug.SHA256SUMS
          python scripts/check_release_artifact.py android/app/build/outputs/apk/release/app-release-unsigned.apk build/release/app-release-unsigned.SHA256SUMS

      - name: Upload APKs and checksums
        uses: actions/upload-artifact@v4
        with:
          name: aetherlearn-apks
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release-unsigned.apk
            build/release/*.SHA256SUMS
