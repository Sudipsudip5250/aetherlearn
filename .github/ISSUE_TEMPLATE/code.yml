name: Code issue
description: Report a reproducible bug or implementation problem.
title: "[Code] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, private keys, personal learning data, or sensitive host information. Use SECURITY.md for vulnerabilities.
  - type: input
    id: component
    attributes:
      label: Component
      placeholder: "e.g. content validator, pack builder, Android shell"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "OS, Python version, commit, device, or browser"
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Checks already run
