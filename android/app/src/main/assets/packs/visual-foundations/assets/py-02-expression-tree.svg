<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Expression grouping affects the result.</title><desc id="desc">The small expression tree groups multiplication before addition, producing 11 rather than treating all operators as a left-to-right list.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b34b2b"/></marker></defs><rect width="640" height="360" fill="#ffffff"/><text x="320" y="38" text-anchor="middle" font-size="22" font-family="sans-serif" font-weight="700" fill="#17152a">Expression grouping affects the result.</text><path d="M320 92 V138 M320 138 H170 M320 138 H470 M170 138 V210 M470 138 V210" fill="none" stroke="#40318f" stroke-width="4"/><circle cx="320" cy="72" r="28" fill="#f4f1ff" stroke="#40318f" stroke-width="3"/><circle cx="170" cy="238" r="28" fill="#fff4d6" stroke="#b34b2b" stroke-width="3"/><circle cx="470" cy="238" r="28" fill="#e7f4ee" stroke="#2b6f55" stroke-width="3"/><text x="320" y="78" text-anchor="middle" font-size="15" font-family="sans-serif">3</text><text x="170" y="244" text-anchor="middle" font-size="15" font-family="sans-serif">+</text><text x="470" y="244" text-anchor="middle" font-size="15" font-family="sans-serif">2</text><text x="320" y="300" text-anchor="middle" font-size="17" font-family="sans-serif">*</text><text x="320" y="348" text-anchor="middle" font-size="14" font-family="sans-serif" fill="#17152a">Static study diagram · labels are part of the explanation</text></svg>