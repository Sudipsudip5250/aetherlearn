<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">Semantic page structure</title>
  <desc id="desc">A page outline contains a header, navigation, main content, and footer; meaningful landmarks help people and assistive technology move around the page.</desc>
  <rect width="720" height="360" rx="20" fill="#fff8ea"/>
  <text x="360" y="42" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#5b3b13">Meaningful page landmarks</text>
  <g font-family="sans-serif" fill="#5b3b13">
    <rect x="64" y="68" width="592" height="256" rx="14" fill="#fff" stroke="#bb7b24" stroke-width="3"/>
    <rect x="88" y="88" width="544" height="48" rx="9" fill="#f9dfb0" stroke="#bb7b24" stroke-width="2"/><text x="360" y="119" text-anchor="middle" font-size="20" font-weight="700">header</text>
    <rect x="88" y="148" width="160" height="112" rx="9" fill="#f6edcf" stroke="#bb7b24" stroke-width="2"/><text x="168" y="207" text-anchor="middle" font-size="20" font-weight="700">nav</text><text x="168" y="232" text-anchor="middle" font-size="14">wayfinding</text>
    <rect x="264" y="148" width="368" height="112" rx="9" fill="#e9f3e8" stroke="#5b8a53" stroke-width="2"/><text x="448" y="207" text-anchor="middle" font-size="20" font-weight="700">main</text><text x="448" y="232" text-anchor="middle" font-size="14">the lesson content</text>
    <rect x="88" y="272" width="544" height="36" rx="9" fill="#f9dfb0" stroke="#bb7b24" stroke-width="2"/><text x="360" y="296" text-anchor="middle" font-size="18" font-weight="700">footer</text>
  </g>
</svg>
