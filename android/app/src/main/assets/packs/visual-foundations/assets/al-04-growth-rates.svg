<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Different growth rates scale differently as input grows.</title><desc id="desc">The conceptual chart compares logarithmic, linear, and quadratic growth; it is an intuition aid, not a measured benchmark.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b34b2b"/></marker></defs><rect width="640" height="360" fill="#ffffff"/><text x="320" y="38" text-anchor="middle" font-size="22" font-family="sans-serif" font-weight="700" fill="#17152a">Different growth rates scale differently as input grows.</text><path d="M80 280 H580 M80 280 V60" stroke="#17152a" stroke-width="3"/><path d="M100 262 C180 235 260 205 580 100" fill="none" stroke="#2b6f55" stroke-width="5"/><path d="M100 260 L580 80" fill="none" stroke="#40318f" stroke-width="5"/><path d="M100 260 C220 258 350 220 580 70" fill="none" stroke="#b34b2b" stroke-width="5"/><text x="130" y="110" font-size="18" font-family="sans-serif">log n</text><text x="430" y="150" font-size="18" font-family="sans-serif">n</text><text x="430" y="80" font-size="18" font-family="sans-serif">n²</text><text x="320" y="330" text-anchor="middle" font-size="17" font-family="sans-serif">Input size</text><text x="320" y="348" text-anchor="middle" font-size="14" font-family="sans-serif" fill="#17152a">Static study diagram · labels are part of the explanation</text></svg>