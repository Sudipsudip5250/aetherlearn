<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">A test case compares an expected result with an actual result.</title><desc id="desc">The test grid makes input, expected output, actual output, and pass/fail evidence explicit.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b34b2b"/></marker></defs><rect width="640" height="360" fill="#ffffff"/><text x="320" y="38" text-anchor="middle" font-size="22" font-family="sans-serif" font-weight="700" fill="#17152a">A test case compares an expected result with an actual result.</text><rect x="80" y="78" width="480" height="190" fill="#f4f1ff" stroke="#40318f" stroke-width="3"/><path d="M80 132 H560 M80 200 H560 M240 78 V268 M400 78 V268" stroke="#40318f" stroke-width="3"/><text x="160" y="113" text-anchor="middle" font-size="17" font-family="sans-serif">Input</text><text x="320" y="113" text-anchor="middle" font-size="17" font-family="sans-serif">Expected</text><text x="480" y="113" text-anchor="middle" font-size="17" font-family="sans-serif">Actual</text><text x="160" y="170" text-anchor="middle" font-size="17" font-family="sans-serif">A</text><text x="320" y="170" text-anchor="middle" font-size="17" font-family="sans-serif">→</text><text x="480" y="170" text-anchor="middle" font-size="17" font-family="sans-serif">B</text><text x="160" y="238" text-anchor="middle" font-size="17" font-family="sans-serif">C</text><text x="320" y="238" text-anchor="middle" font-size="17" font-family="sans-serif">→</text><text x="480" y="238" text-anchor="middle" font-size="17" font-family="sans-serif">D</text><text x="320" y="348" text-anchor="middle" font-size="14" font-family="sans-serif" fill="#17152a">Static study diagram · labels are part of the explanation</text></svg>