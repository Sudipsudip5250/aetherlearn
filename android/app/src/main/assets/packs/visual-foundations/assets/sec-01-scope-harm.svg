<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Ethical practice narrows scope before action.</title><desc id="desc">A safe decision flow identifies the request, confirms authorization and scope, considers harm, and chooses a bounded next step.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b34b2b"/></marker></defs><rect width="640" height="360" fill="#ffffff"/><text x="320" y="38" text-anchor="middle" font-size="22" font-family="sans-serif" font-weight="700" fill="#17152a">Ethical practice narrows scope before action.</text><rect x="36" y="136" width="128" height="76" rx="12" fill="#f4f1ff" stroke="#40318f" stroke-width="3"/><text x="100" y="180" text-anchor="middle" font-size="18" font-family="sans-serif">Request</text><path d="M164 174 H260" stroke="#b34b2b" stroke-width="4" marker-end="url(#arrow)"/><polygon points="330,112 410,174 330,236 250,174" fill="#fff4d6" stroke="#b34b2b" stroke-width="3"/><text x="330" y="180" text-anchor="middle" font-size="18" font-family="sans-serif">Check</text><path d="M410 174 H540" stroke="#2b6f55" stroke-width="4" marker-end="url(#arrow)"/><text x="475" y="154" text-anchor="middle" font-size="17" font-family="sans-serif">Scope</text><path d="M330 236 V292 H540" fill="none" stroke="#b34b2b" stroke-width="4" marker-end="url(#arrow)"/><text x="475" y="278" text-anchor="middle" font-size="17" font-family="sans-serif">Risk</text><rect x="540" y="136" width="76" height="76" rx="12" fill="#e7f4ee" stroke="#2b6f55" stroke-width="3"/><text x="578" y="180" text-anchor="middle" font-size="17" font-family="sans-serif">Safe next step</text><text x="320" y="348" text-anchor="middle" font-size="14" font-family="sans-serif" fill="#17152a">Static study diagram · labels are part of the explanation</text></svg>